      margin: 0;

      margin: 0;
      color: #666;

      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;

      margin-top: 20px;
      font-weight: bold;
    }

    #timer {
      color: #d93045;
    }

    .question-card {
      width: 100%;
      overflow-wrap: anywhere;
    }

    .question-title {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.6;
    }

    .question-number {
      flex-shrink: 0;
      color: #6254df;
      font-weight: bold;
    }

    .question-text {
      min-width: 0;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      width: 100%;
      min-height: 44px;
      padding: 12px;
      margin: 10px 0;
      background: #f7f7ff;
      border: 1px solid #e1e2f4;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s;
    }

    .option:hover {
      background: #eeeeff;
      border-color: #aaa1ff;
    }

    .option.selected {
      background: #e9e7ff;
      border-color: #6254df;
    }

    .option-letter {
      flex-shrink: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid #aaa;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }

    .option.selected .option-letter {
      background: #6254df;
      border-color: #6254df;
      color: white;
    }

    .option.correct {
      background: #e1f8e8;
      border-color: #28a745;
    }

    .option.wrong {
      background: #ffe5e8;
      border-color: #dc3545;
    }

    .option:disabled {
      cursor: default;
      color: #252641;
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    button {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-btn {
      background: #6254df;
      color: white;
    }

    .primary-btn:hover {
      background: #4e40ca;
    }

    .secondary-btn {
      background: #e9e8ff;
      color: #5143ce;
    }

    .result-card {
      display: none;
    }

    .result-card h2 {
      color: #6254df;
      margin-top: 0;
    }

    #scoreText {
      font-size: 25px;
      font-weight: bold;
    }

    .review-item {
      padding: 16px;
      margin-top: 14px;
      background: #f7f7ff;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .review-item p {
      margin: 8px 0;
    }

    .correct-text {
      color: #16803d;
    }

    .wrong-text {
      color: #d12b3f;
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: #777;
    }

    @media (max-width: 520px) {
      .header,
      .question-card,
      .result-card {
        padding: 17px;
      }

      .test-info {
        flex-direction: column;
        gap: 7px;
      }

      .question-title {
        font-size: 16px;
      }
    }
  </style>

      {
        q: "Which input type masks the characters entered?",

      },
      {

        answer: 3,

      },
      {
        q: "Which element creates a drop-down selection control?",
        options: ["<dropdown>", "<select>", "<optionlist>", "<inputlist>"],
        answer: 1,
        explanation: "The select element creates a selection control."
      },
      {
        q: "Which attribute identifies an element uniquely within a page?",
        options: ["class", "style", "id", "type"],
        answer: 2,
        explanation: "The id attribute identifies a unique element in the document."
      },
      {
        q: "Which attribute can be shared by multiple elements for styling?",
        options: ["id", "class", "unique", "key"],
        answer: 1,
        explanation: "Multiple elements can share the same class name."
      },
      {
        q: "Which attribute specifies an image file's location?",
        options: ["href", "link", "src", "path"],
        answer: 2,
        explanation: "The src attribute specifies the image resource location."
      },
      {
        q: "Which element represents a table row?",
        options: ["<td>", "<tr>", "<th>", "<table-row>"],
        answer: 1,
        explanation: "The tr element represents a table row."
      },
      {
        q: "Which element represents a standard table data cell?",
        options: ["<tr>", "<tabledata>", "<th>", "<td>"],
        answer: 3,
        explanation: "The td element represents a data cell in a table."
      },
      {
        q: "Which element represents a table header cell?",
        options: ["<head>", "<th>", "<td>", "<theadcell>"],
        answer: 1,
        explanation: "The th element represents a header cell in a table."
      },
      {
        q: "Which element is used to embed video content?",
        options: ["<movie>", "<media>", "<video>", "<play>"],
        answer: 2,
        explanation: "The video element embeds video content."
      },
      {
        q: "Which element is used to embed audio content?",
        options: ["<music>", "<sound>", "<media>", "<audio>"],
        answer: 3,
        explanation: "The audio element embeds audio content."
      },
      {
        q: "Which attribute makes a form field mandatory?",
        options: ["required", "validate", "must", "mandatory"],
        answer: 0,
        explanation: "The required attribute prevents form submission until the field is completed."
      },
      {
        q: "Which element represents navigation links?",
        options: ["<navigate>", "<links>", "<nav>", "<navigationlinks>"],
        answer: 2,
        explanation: "The nav element represents a section of navigation links."

        q: "Which element represents a page or section footer?",
        options: ["<bottom>", "<footer>", "<foot>", "<end>"],

      },

        q: "Which element represents the main content of a page?",
        options: ["<header>", "<nav>", "<aside>", "<main>"],
        answer: 3,
        explanation: "The main element represents the dominant content of the document."
      },
      {
        q: "Which tag includes JavaScript in an HTML document?",
        options: ["<javascript>", "<script>", "<js>", "<code>"],
        answer: 1,
        explanation: "The script element is used to include or reference JavaScript."
      },
      {
        q: "Which attribute specifies inline CSS declarations?",
        options: ["css", "design", "style", "format"],
        answer: 2,
        explanation: "The style attribute applies inline CSS declarations to an element."
      },
      {
        q: "Which tag defines an internal CSS stylesheet?",
        options: ["<css>", "<script>", "<design>", "<style>"],
        answer: 3,
        explanation: "The style element contains CSS rules, typically in the document head."
      },
      {
        q: "Which HTML comment syntax is correct?",
        options: [
          "<!-- comment -->",
          "// comment",
          "/* comment */",
          "<comment>text</comment>"
        ],
        answer: 0,
        explanation: "HTML comments begin with <!-- and end with -->."
      },
      {
        q: "Which attribute sets an image's width?",
        options: ["length", "width", "size", "scale"],
        answer: 1,
        explanation: "The width attribute specifies the image's width."
      },
      {
        q: "Which attribute opens a link in a new browsing context when set to _blank?",
        options: ["href='_blank'", "rel='_blank'", "target='_blank'", "open='_blank'"],
        answer: 2,
        explanation: "The target attribute with the value _blank opens a link in a new browsing context."
      },
      {
        q: "Which element represents a term in a description list?",
        options: ["<dd>", "<dl>", "<li>", "<dt>"],
        answer: 3,
        explanation: "The dt element represents a term or name in a description list."
      },
      {
        q: "Which element represents a description or value in a description list?",
        options: ["<dd>", "<dt>", "<dl>", "<li>"],
        answer: 0,
        explanation: "The dd element provides the description or value associated with a term."
      },
      {
        q: "Which tag creates a button control?",
        options: ["<btn>", "<button>", "<click>", "<control>"],
        answer: 1,
        explanation: "The button element creates a clickable button."
      },
      {
        q: "Which attribute provides text shown as a tooltip in many browsers?",
        options: ["alt", "hint", "title", "tooltip"],
        answer: 2,
        explanation: "The title attribute can provide advisory information, often displayed as a tooltip."
      },
      {
        q: "Which tag marks up emphasized text?",
        options: ["<em>", "<mark>", "<small>", "<sub>"],
        answer: 0,
        explanation: "The em element marks stress emphasis."
      },
      {
        q: "Which element is commonly used as a generic block-level container?",
        options: ["<span>", "<div>", "<label>", "<strong>"],
        answer: 1,
        explanation: "The div element is a generic container commonly used for grouping block-level content."
      },
      {
        q: "Which element is commonly used as a generic inline container?",
        options: ["<section>", "<article>", "<span>", "<main>"],
        answer: 2,
        explanation: "The span element is a generic inline container."

    ];

    const QUESTIONS_PER_TEST = 25;
    const TOTAL_TIME = 10 * 60;

    const form = document.getElementById("testForm");
    const questionsContainer = document.getElementById("questionsContainer");
    const timerElement = document.getElementById("timer");
    const resultCard = document.getElementById("resultCard");
    const reviewContainer = document.getElementById("reviewContainer");

    let quizQuestions = [];
    let selectedAnswers = [];
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let submitted = false;

    // This file is currently the HTML Easy test page.
    // If another test was selected, show a message instead.
    const selectedSkill = localStorage.getItem("selectedSkill");
    const selectedLevel = localStorage.getItem("selectedLevel");

    if (
      (selectedSkill && selectedSkill !== "HTML") ||
      (selectedLevel && selectedLevel !== "Easy")
    ) {
      document.getElementById("testHeader").style.display = "none";
      form.style.display = "none";
      resultCard.style.display = "block";

      resultCard.innerHTML = `
        <h2>Test Not Available Yet</h2>
        <p>Abhi sirf HTML Easy test ready hai.</p>
        <p>Dashboard par jaakar HTML Easy select karo.</p>
        <br>
        <a href="main.html">Back to Dashboard</a>
      `;
    } else {
      startTest();
    }

    function shuffleArray(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function startTest() {
      // Randomly select 25 distinct questions from the 50-question bank.
      quizQuestions = shuffleArray(allQuestions).slice(0, QUESTIONS_PER_TEST);

      selectedAnswers = Array(quizQuestions.length).fill(null);

      renderQuestions();
      updateTimer();
      timerInterval = setInterval(tickTimer, 1000);
    }

    function renderQuestions() {
      questionsContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {
        const card = document.createElement("section");
        card.className = "question-card";

        const title = document.createElement("h3");
        title.className = "question-title";

        const number = document.createElement("span");
        number.className = "question-number";
        number.textContent = `Q${questionIndex + 1}.`;

        const questionText = document.createElement("span");
        questionText.className = "question-text";
        questionText.textContent = question.q;

        title.append(number, questionText);
        card.appendChild(title);

        // Shuffle options too, while preserving the correct answer.
        const options = shuffleArray(
          question.options.map((text, originalIndex) => ({
            text,
            isCorrect: originalIndex === question.answer
          }))
        );

        question.displayOptions = options;

        options.forEach((option, optionIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "option";

          const letter = document.createElement("span");
          letter.className = "option-letter";
          letter.textContent = String.fromCharCode(65 + optionIndex);

          const text = document.createElement("span");
          text.textContent = option.text;

          button.append(letter, text);

          button.addEventListener("click", () => {
            if (submitted) return;

            selectedAnswers[questionIndex] = optionIndex;

            card.querySelectorAll(".option").forEach(item => {
              item.classList.remove("selected");
            });

            button.classList.add("selected");
          });

          card.appendChild(button);
        });

        questionsContainer.appendChild(card);
      });
    }

    function tickTimer() {
      if (submitted) return;

      timeLeft--;
      updateTimer();

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        finishTest(true);
      }
    }

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      timerElement.textContent =
        `Time Left: ${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (submitted) return;

      const attempted = selectedAnswers.filter(answer => answer !== null).length;

      if (!confirm(
        `You answered ${attempted} out of ${QUESTIONS_PER_TEST} questions. Submit test?`
      )) {
        return;
      }

      finishTest(false);
    });

    function finishTest(autoSubmitted) {
      if (submitted) return;

      submitted = true;
      clearInterval(timerInterval);

      let score = 0;
      let attempted = 0;

      quizQuestions.forEach((question, questionIndex) => {
        const selected = selectedAnswers[questionIndex];

        if (selected !== null) attempted++;

        const correctDisplayIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        if (selected === correctDisplayIndex) score++;

        const card = questionsContainer.children[questionIndex];
        const optionButtons = card.querySelectorAll(".option");

        optionButtons.forEach((button, optionIndex) => {
          button.disabled = true;

          if (question.displayOptions[optionIndex].isCorrect) {
            button.classList.add("correct");
          }

          if (
            selected === optionIndex &&
            !question.displayOptions[optionIndex].isCorrect
          ) {
            button.classList.add("wrong");
          }
        });
      });

      form.style.display = "none";
      document.getElementById("testHeader").style.display = "none";
      resultCard.style.display = "block";

      const percentage = Math.round((score / QUESTIONS_PER_TEST) * 100);

      document.getElementById("scoreText").textContent =
        `Your Score: ${score}/${QUESTIONS_PER_TEST} (${percentage}%)`;

      document.getElementById("resultMessage").textContent =
        `${attempted} attempted • ${QUESTIONS_PER_TEST - attempted} unanswered` +
        (autoSubmitted ? " • Time is over; test submitted automatically." : "");

      renderReview();
      saveTestHistory(score);

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview() {
      reviewContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {
        const selected = selectedAnswers[questionIndex];
        const correctIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        const review = document.createElement("div");
        review.className = "review-item";

        const title = document.createElement("strong");
        title.textContent = `Q${questionIndex + 1}. ${question.q}`;
        review.appendChild(title);

        const yourAnswer = document.createElement("p");
        yourAnswer.textContent = selected === null
          ? "Your answer: Not attempted"
          : `Your answer: ${question.displayOptions[selected].text}`;

        yourAnswer.className =
          selected === correctIndex ? "correct-text" : "wrong-text";

        review.appendChild(yourAnswer);

        const correctAnswer = document.createElement("p");
        correctAnswer.className = "correct-text";
        correctAnswer.textContent =
          `Correct answer: ${question.displayOptions[correctIndex].text}`;
        review.appendChild(correctAnswer);

        const explanation = document.createElement("p");
        explanation.textContent = `Explanation: ${question.explanation}`;
        review.appendChild(explanation);

        reviewContainer.appendChild(review);
      });
    }

    function saveTestHistory(score) {
      const currentUser = JSON.parse(
        localStorage.getItem("skillCheckCurrentUser") || "null"
      );

      if (!currentUser || !currentUser.username) return;

      let history = [];

      try {
        const storedHistory = JSON.parse(
          localStorage.getItem("skillCheckTestHistory") || "[]"
        );

        if (Array.isArray(storedHistory)) {
          history = storedHistory;
        }
      } catch (error) {
        history = [];
      }

      history.push({
        username: currentUser.username,
        skill: "HTML",
        level: "Easy",
        score: score,
        date: new Date().toLocaleString()
      });

      localStorage.setItem(
        "skillCheckTestHistory",
        JSON.stringify(history)
      );
    }
