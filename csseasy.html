<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillCheck - CSS Easy Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4ff;
      color: #252641;
      line-height: 1.5;
    }

    nav {
      background: #fff;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }

    nav h2 {
      margin: 0;
      color: #6254df;
    }

    nav a {
      color: #6254df;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: min(850px, 94%);
      margin: 28px auto;
    }

    .header,
    .question-card,
    .result-card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px #3434770b;
    }

    .header h1 {
      color: #6254df;
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .test-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      font-weight: bold;
    }

    #timer {
      color: #d93045;
    }

    .question-card {
      width: 100%;
      overflow-wrap: anywhere;
    }

    .question-title {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.6;
    }

    .question-number {
      flex-shrink: 0;
      color: #6254df;
      font-weight: bold;
    }

    .question-text {
      min-width: 0;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      width: 100%;
      min-height: 44px;
      padding: 12px;
      margin: 10px 0;
      background: #f7f7ff;
      border: 1px solid #e1e2f4;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s;
    }

    .option:hover {
      background: #eeeeff;
      border-color: #aaa1ff;
    }

    .option.selected {
      background: #e9e7ff;
      border-color: #6254df;
    }

    .option-letter {
      flex-shrink: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid #aaa;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }

    .option.selected .option-letter {
      background: #6254df;
      border-color: #6254df;
      color: white;
    }

    .option.correct {
      background: #e1f8e8;
      border-color: #28a745;
    }

    .option.wrong {
      background: #ffe5e8;
      border-color: #dc3545;
    }

    .option:disabled {
      cursor: default;
      color: #252641;
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    button {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-btn {
      background: #6254df;
      color: white;
    }

    .primary-btn:hover {
      background: #4e40ca;
    }

    .secondary-btn {
      background: #e9e8ff;
      color: #5143ce;
    }

    .result-card {
      display: none;
    }

    .result-card h2 {
      color: #6254df;
      margin-top: 0;
    }

    #scoreText {
      font-size: 25px;
      font-weight: bold;
    }

    .review-item {
      padding: 16px;
      margin-top: 14px;
      background: #f7f7ff;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .review-item p {
      margin: 8px 0;
    }

    .correct-text {
      color: #16803d;
    }

    .wrong-text {
      color: #d12b3f;
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: #777;
    }

    @media (max-width: 520px) {
      .header,
      .question-card,
      .result-card {
        padding: 17px;
      }

      .test-info {
        flex-direction: column;
        gap: 7px;
      }

      .question-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <h2>SkillCheck</h2>
    <a href="main.html">← Dashboard</a>
  </nav>

  <main class="container">

    <section class="header" id="testHeader">
      <h1>CSS - Easy Test</h1>
      <p>Test your CSS basics. Choose one answer for each question.</p>

      <div class="test-info">
        <span>Questions: 25</span>
        <span>Maximum Marks: 25</span>
        <span id="timer">Time Left: 10:00</span>
      </div>
    </section>

    <form id="testForm">
      <div id="questionsContainer"></div>

      <div class="actions" id="testActions">
        <a href="main.html" style="color:#6254df;text-decoration:none;">
          Back to Dashboard
        </a>

        <button type="submit" class="btn primary-btn" id="submitBtn">
          Submit Test
        </button>
      </div>
    </form>

    <section class="result-card" id="resultCard">
      <h2>Test Completed!</h2>
      <p id="scoreText"></p>
      <p id="resultMessage"></p>

      <div class="actions">
        <a href="main.html" style="text-decoration:none;">
          <button type="button" class="btn secondary-btn">Dashboard</button>
        </a>

        <button type="button" class="btn primary-btn" onclick="location.reload()">
          Try Again
        </button>
      </div>

      <h3>Answer Review</h3>
      <div id="reviewContainer"></div>
    </section>

  </main>

  <footer>
    &copy; 2026 SkillCheck | Improve Your Skills, One Test at a Time
  </footer>

  <script>

    // QUESTION BANK: 25 CSS Easy questions

    const allQuestions = [
      {
        q: "What does CSS stand for?",
        options: [
          "Computer Style Sheets",
          "Cascading Style Sheets",
          "Creative Style System",
          "Colorful Style Sheets"
        ],
        answer: 1,
        explanation: "CSS stands for Cascading Style Sheets. It is used to style and design HTML elements."
      },
      {
        q: "Which HTML tag is used to link an external CSS file?",
        options: ["<style>", "<css>", "<link>", "<script>"],
        answer: 2,
        explanation: "The <link> tag is used inside the HTML head section to connect an external CSS file."
      },
      {
        q: "Which property is used to change the text color?",
        options: ["font-color", "text-color", "color", "background-color"],
        answer: 2,
        explanation: "The color property changes the text color of an element."
      },
      {
        q: "Which CSS property changes the background color?",
        options: ["color", "background-color", "bgcolor", "background-style"],
        answer: 1,
        explanation: "The background-color property sets the background color of an element."
      },
      {
        q: "Which symbol is used to select an element by its ID in CSS?",
        options: [".", "#", "*", "&"],
        answer: 1,
        explanation: "The # symbol is used to select an HTML element by its ID."
      },
      {
        q: "Which symbol is used to select elements by class?",
        options: ["#", ".", "*", "@"],
        answer: 1,
        explanation: "A dot (.) is used before a class name to select elements having that class."
      },
      {
        q: "Which CSS property is used to change the font size?",
        options: ["font-style", "text-size", "font-size", "text-style"],
        answer: 2,
        explanation: "The font-size property controls the size of text."
      },
      {
        q: "Which CSS property makes text bold?",
        options: ["font-weight", "font-style", "text-bold", "text-weight"],
        answer: 0,
        explanation: "The font-weight property controls the thickness of text. The value bold makes text bold."
      },
      {
        q: "Which property is used to align text to the center?",
        options: ["align", "text-align", "font-align", "position"],
        answer: 1,
        explanation: "text-align: center; aligns text horizontally in the center."
      },
      {
        q: "Which CSS property is used to add space inside an element?",
        options: ["margin", "padding", "border", "spacing"],
        answer: 1,
        explanation: "Padding creates space between the content and the element's border."
      },
      {
        q: "Which CSS property creates space outside an element?",
        options: ["padding", "margin", "border", "outline"],
        answer: 1,
        explanation: "Margin creates space outside an element's border."
      },
      {
        q: "Which CSS property is used to add a border?",
        options: ["outline-color", "border", "box", "line"],
        answer: 1,
        explanation: "The border property is used to add a border around an HTML element."
      },
      {
        q: "Which property is used to change the font family?",
        options: ["font-family", "font-style", "font-type", "text-family"],
        answer: 0,
        explanation: "The font-family property specifies the typeface used for text."
      },
      {
        q: "Which CSS property is used to make text italic?",
        options: ["font-weight", "font-style", "text-decoration", "font-family"],
        answer: 1,
        explanation: "The font-style property with the value italic makes text italic."
      },
      {
        q: "Which value of the display property makes an element a block-level element?",
        options: ["inline", "none", "block", "flex"],
        answer: 2,
        explanation: "display: block; makes an element behave as a block-level element."
      },
      {
        q: "Which CSS property is used to hide an element completely from the page layout?",
        options: ["visibility: hidden", "display: none", "opacity: 0", "position: hidden"],
        answer: 1,
        explanation: "display: none; removes the element from the document layout."
      },
      {
        q: "Which property is used to change the width of an element?",
        options: ["height", "size", "width", "length"],
        answer: 2,
        explanation: "The width property specifies the width of an element."
      },
      {
        q: "Which property is used to change the height of an element?",
        options: ["width", "height", "size", "length"],
        answer: 1,
        explanation: "The height property specifies the height of an element."
      },
      {
        q: "Which CSS property is used to round the corners of an element?",
        options: ["border-style", "border-radius", "corner-radius", "border-round"],
        answer: 1,
        explanation: "The border-radius property creates rounded corners."
      },
      {
        q: "Which CSS property is used to add a shadow around a box?",
        options: ["text-shadow", "box-shadow", "border-shadow", "shadow-box"],
        answer: 1,
        explanation: "The box-shadow property adds shadow effects around an element's box."
      },
      {
        q: "Which property is used to control the transparency of an element?",
        options: ["visibility", "opacity", "transparent", "display"],
        answer: 1,
        explanation: "The opacity property controls the transparency level of an element."
      },
      {
        q: "Which CSS property changes the mouse pointer when hovering over an element?",
        options: ["mouse", "pointer", "cursor", "hover"],
        answer: 2,
        explanation: "The cursor property controls the mouse pointer appearance."
      },
      {
        q: "Which CSS property is used to remove the underline from a link?",
        options: [
          "text-decoration: none",
          "font-style: none",
          "link-style: none",
          "decoration: none"
        ],
        answer: 0,
        explanation: "text-decoration: none; removes the default underline from links."
      },
      {
        q: "Which CSS property is used to set the position of an element?",
        options: ["display", "position", "float", "align"],
        answer: 1,
        explanation: "The position property specifies how an element is positioned in the document."
      },
      {
        q: "Which CSS property is used to control the space between lines of text?",
        options: ["letter-spacing", "word-spacing", "line-height", "text-spacing"],
        answer: 2,
        explanation: "The line-height property controls the height of a line of text."
      }
    ];

    const QUESTIONS_PER_TEST = 25;
    const TOTAL_TIME = 10 * 60;

    const form = document.getElementById("testForm");
    const questionsContainer = document.getElementById("questionsContainer");
    const timerElement = document.getElementById("timer");
    const resultCard = document.getElementById("resultCard");
    const reviewContainer = document.getElementById("reviewContainer");

    let quizQuestions = [];
    let selectedAnswers = [];
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let submitted = false;

    // CSS Easy test page check

    const selectedSkill = localStorage.getItem("selectedSkill");
    const selectedLevel = localStorage.getItem("selectedLevel");

    if (
      (selectedSkill && selectedSkill !== "CSS") ||
      (selectedLevel && selectedLevel !== "Easy")
    ) {
      document.getElementById("testHeader").style.display = "none";
      form.style.display = "none";
      resultCard.style.display = "block";

      resultCard.innerHTML = `
        <h2>Test Not Available Yet</h2>
        <p>Abhi sirf CSS Easy test select karo.</p>
        <p>Dashboard par jaakar CSS Easy select karo.</p>
        <br>
        <a href="main.html">Back to Dashboard</a>
      `;
    } else {
      startTest();
    }

    function shuffleArray(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function startTest() {
      quizQuestions = shuffleArray(allQuestions).slice(0, QUESTIONS_PER_TEST);

      selectedAnswers = Array(quizQuestions.length).fill(null);

      renderQuestions();
      updateTimer();

      timerInterval = setInterval(tickTimer, 1000);
    }

    function renderQuestions() {
      questionsContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {
        const card = document.createElement("section");
        card.className = "question-card";

        const title = document.createElement("h3");
        title.className = "question-title";

        const number = document.createElement("span");
        number.className = "question-number";
        number.textContent = `Q${questionIndex + 1}.`;

        const questionText = document.createElement("span");
        questionText.className = "question-text";
        questionText.textContent = question.q;

        title.append(number, questionText);
        card.appendChild(title);

        const options = shuffleArray(
          question.options.map((text, originalIndex) => ({
            text,
            isCorrect: originalIndex === question.answer
          }))
        );

        question.displayOptions = options;

        options.forEach((option, optionIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "option";

          const letter = document.createElement("span");
          letter.className = "option-letter";
          letter.textContent = String.fromCharCode(65 + optionIndex);

          const text = document.createElement("span");
          text.textContent = option.text;

          button.append(letter, text);

          button.addEventListener("click", () => {
            if (submitted) return;

            selectedAnswers[questionIndex] = optionIndex;

            card.querySelectorAll(".option").forEach(item => {
              item.classList.remove("selected");
            });

            button.classList.add("selected");
          });

          card.appendChild(button);
        });

        questionsContainer.appendChild(card);
      });
    }

    function tickTimer() {
      if (submitted) return;

      timeLeft--;
      updateTimer();

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        finishTest(true);
      }
    }

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      timerElement.textContent =
        `Time Left: ${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (submitted) return;

      const attempted = selectedAnswers.filter(
        answer => answer !== null
      ).length;

      if (!confirm(
        `You answered ${attempted} out of ${QUESTIONS_PER_TEST} questions. Submit test?`
      )) {
        return;
      }

      finishTest(false);
    });

    function finishTest(autoSubmitted) {
      if (submitted) return;

      submitted = true;
      clearInterval(timerInterval);

      let score = 0;
      let attempted = 0;

      quizQuestions.forEach((question, questionIndex) => {
        const selected = selectedAnswers[questionIndex];

        if (selected !== null) attempted++;

        const correctDisplayIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        if (selected === correctDisplayIndex) score++;

        const card = questionsContainer.children[questionIndex];
        const optionButtons = card.querySelectorAll(".option");

        optionButtons.forEach((button, optionIndex) => {
          button.disabled = true;

          if (question.displayOptions[optionIndex].isCorrect) {
            button.classList.add("correct");
          }

          if (
            selected === optionIndex &&
            !question.displayOptions[optionIndex].isCorrect
          ) {
            button.classList.add("wrong");
          }
        });
      });

      form.style.display = "none";
      document.getElementById("testHeader").style.display = "none";
      resultCard.style.display = "block";

      const percentage = Math.round(
        (score / QUESTIONS_PER_TEST) * 100
      );

      document.getElementById("scoreText").textContent =
        `Your Score: ${score}/${QUESTIONS_PER_TEST} (${percentage}%)`;

      document.getElementById("resultMessage").textContent =
        `${attempted} attempted • ${QUESTIONS_PER_TEST - attempted} unanswered` +
        (autoSubmitted ? " • Time is over; test submitted automatically." : "");

      renderReview();
      saveTestHistory(score);

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview() {
      reviewContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {
        const selected = selectedAnswers[questionIndex];

        const correctIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        const review = document.createElement("div");
        review.className = "review-item";

        const title = document.createElement("strong");
        title.textContent = `Q${questionIndex + 1}. ${question.q}`;

        review.appendChild(title);

        const yourAnswer = document.createElement("p");

        yourAnswer.textContent = selected === null
          ? "Your answer: Not attempted"
          : `Your answer: ${question.displayOptions[selected].text}`;

        yourAnswer.className =
          selected === correctIndex ? "correct-text" : "wrong-text";

        review.appendChild(yourAnswer);

        const correctAnswer = document.createElement("p");
        correctAnswer.className = "correct-text";

        correctAnswer.textContent =
          `Correct answer: ${question.displayOptions[correctIndex].text}`;

        review.appendChild(correctAnswer);

        const explanation = document.createElement("p");
        explanation.textContent = `Explanation: ${question.explanation}`;

        review.appendChild(explanation);
        reviewContainer.appendChild(review);
      });
    }

    function saveTestHistory(score) {
      const currentUser = JSON.parse(
        localStorage.getItem("skillCheckCurrentUser") || "null"
      );

      if (!currentUser || !currentUser.username) return;

      let history = [];

      try {
        const storedHistory = JSON.parse(
          localStorage.getItem("skillCheckTestHistory") || "[]"
        );

        if (Array.isArray(storedHistory)) {
          history = storedHistory;
        }
      } catch (error) {
        history = [];
      }

      history.push({
        username: currentUser.username,
        skill: "CSS",
        level: "Easy",
        score: score,
        date: new Date().toLocaleString()
      });

      localStorage.setItem(
        "skillCheckTestHistory",
        JSON.stringify(history)
      );
    }

  </script>

</body>
</html>
