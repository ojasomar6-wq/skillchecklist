<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillCheck - C Moderate Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4ff;
      color: #252641;
      line-height: 1.5;
    }

    nav {
      background: #fff;
      padding: 16px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }

    nav h2 {
      margin: 0;
      color: #6254df;
    }

    nav a {
      color: #6254df;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: min(850px, 94%);
      margin: 28px auto;
    }

    .header,
    .question-card,
    .result-card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px #3434770b;
    }

    .header h1 {
      color: #6254df;
      margin: 0 0 8px;
    }

    .header p {
      margin: 0;
      color: #666;
    }

    .test-info {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      font-weight: bold;
    }

    #timer {
      color: #d93045;
    }

    .question-card {
      width: 100%;
      overflow-wrap: anywhere;
    }

    .question-title {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 17px;
      line-height: 1.6;
    }

    .question-number {
      flex-shrink: 0;
      color: #6254df;
      font-weight: bold;
    }

    .question-text {
      min-width: 0;
      white-space: pre-line;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      width: 100%;
      min-height: 44px;
      padding: 12px;
      margin: 10px 0;
      background: #f7f7ff;
      border: 1px solid #e1e2f4;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s;
    }

    .option:hover {
      background: #eeeeff;
      border-color: #aaa1ff;
    }

    .option.selected {
      background: #e9e7ff;
      border-color: #6254df;
    }

    .option-letter {
      flex-shrink: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 24px;
      height: 24px;
      border: 1px solid #aaa;
      border-radius: 50%;
      font-size: 12px;
      font-weight: bold;
    }

    .option.selected .option-letter {
      background: #6254df;
      border-color: #6254df;
      color: white;
    }

    .option.correct {
      background: #e1f8e8;
      border-color: #28a745;
    }

    .option.wrong {
      background: #ffe5e8;
      border-color: #dc3545;
    }

    .option:disabled {
      cursor: default;
      color: #252641;
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    button {
      font: inherit;
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary-btn {
      background: #6254df;
      color: white;
    }

    .primary-btn:hover {
      background: #4e40ca;
    }

    .secondary-btn {
      background: #e9e8ff;
      color: #5143ce;
    }

    .result-card {
      display: none;
    }

    .result-card h2 {
      color: #6254df;
      margin-top: 0;
    }

    #scoreText {
      font-size: 25px;
      font-weight: bold;
    }

    .review-item {
      padding: 16px;
      margin-top: 14px;
      background: #f7f7ff;
      border-radius: 9px;
      overflow-wrap: anywhere;
    }

    .review-item p {
      margin: 8px 0;
    }

    .correct-text {
      color: #16803d;
    }

    .wrong-text {
      color: #d12b3f;
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: #777;
    }

    @media (max-width: 520px) {
      .header,
      .question-card,
      .result-card {
        padding: 17px;
      }

      .test-info {
        flex-direction: column;
        gap: 7px;
      }

      .question-title {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <h2>SkillCheck</h2>
    <a href="main.html">← Dashboard</a>
  </nav>

  <main class="container">

    <section class="header" id="testHeader">
      <h1>C Language - Moderate Test</h1>
      <p>Test your C programming knowledge. Choose one answer for each question.</p>

      <div class="test-info">
        <span>Questions: 25</span>
        <span>Maximum Marks: 25</span>
        <span id="timer">Time Left: 10:00</span>
      </div>
    </section>

    <form id="testForm">
      <div id="questionsContainer"></div>

      <div class="actions" id="testActions">
        <a href="main.html" style="color:#6254df;text-decoration:none;">
          Back to Dashboard
        </a>

        <button type="submit" class="btn primary-btn" id="submitBtn">
          Submit Test
        </button>
      </div>
    </form>

    <section class="result-card" id="resultCard">
      <h2>Test Completed!</h2>
      <p id="scoreText"></p>
      <p id="resultMessage"></p>

      <div class="actions">
        <a href="main.html" style="text-decoration:none;">
          <button type="button" class="btn secondary-btn">Dashboard</button>
        </a>

        <button type="button" class="btn primary-btn" onclick="location.reload()">
          Try Again
        </button>
      </div>

      <h3>Answer Review</h3>
      <div id="reviewContainer"></div>
    </section>

  </main>

  <footer>
    &copy; 2026 SkillCheck | Improve Your Skills, One Test at a Time
  </footer>

  <script>

    // QUESTION BANK: 25 C Language Moderate questions

    const allQuestions = [

      {
        q: "What will be the output?\n\nint x = 5;\nprintf(\"%d\", x++);",
        options: ["5", "6", "4", "Compilation error"],
        answer: 0,
        explanation: "Post-increment returns the current value first. The increment happens after the value is used."
      },

      {
        q: "What will be the output?\n\nint x = 5;\nprintf(\"%d\", ++x);",
        options: ["5", "6", "4", "Undefined"],
        answer: 1,
        explanation: "Pre-increment increases x before its value is used, so the output is 6."
      },

      {
        q: "Which storage class allows a local variable to retain its value between function calls?",
        options: ["auto", "static", "register", "extern"],
        answer: 1,
        explanation: "A static local variable is initialized once and retains its value between function calls."
      },

      {
        q: "What will be the output?\n\nint a = 10;\nint *p = &a;\n*p = 25;\nprintf(\"%d\", a);",
        options: ["10", "25", "Address of a", "Garbage value"],
        answer: 1,
        explanation: "The pointer p stores the address of a. Assigning 25 to *p changes the original variable a."
      },

      {
        q: "Which operator is used to access a structure member through a pointer?",
        options: [".", "->", "&", "*"],
        answer: 1,
        explanation: "The arrow operator (->) is used to access structure members through a structure pointer."
      },

      {
        q: "What will be the output?\n\nint a = 17;\nint b = 5;\nprintf(\"%d\", a % b);",
        options: ["2", "3", "5", "12"],
        answer: 0,
        explanation: "The modulo operator returns the remainder. 17 divided by 5 leaves remainder 2."
      },

      {
        q: "Which function allocates memory dynamically and initializes the allocated bytes to zero?",
        options: ["malloc()", "calloc()", "realloc()", "free()"],
        answer: 1,
        explanation: "calloc() allocates memory and initializes all allocated bytes to zero."
      },

      {
        q: "What is the purpose of realloc() in C?",
        options: ["To release allocated memory", "To resize an existing memory block", "To initialize memory to zero", "To declare a pointer"],
        answer: 1,
        explanation: "realloc() changes the size of a previously allocated memory block."
      },

      {
        q: "Which declaration represents a pointer to a constant integer?",
        options: ["const int *p;", "int *const p;", "int const p;", "constant int *p;"],
        answer: 0,
        explanation: "const int *p means the integer value cannot be modified through this pointer, although the pointer itself can point elsewhere."
      },

      {
        q: "What is the guaranteed value of sizeof(char) in C?",
        options: ["0", "1", "2", "4"],
        answer: 1,
        explanation: "sizeof(char) is always 1 in C. One byte is the size of a char."
      },

      {
        q: "Which function compares two strings in C?",
        options: ["strcpy()", "strlen()", "strcmp()", "strcat()"],
        answer: 2,
        explanation: "strcmp() compares two strings and returns 0 when they are equal."
      },

      {
        q: "What will be the output?\n\nint a = 10;\nint *p = &a;\nprintf(\"%d\", *p);",
        options: ["Address of a", "10", "Garbage value", "0"],
        answer: 1,
        explanation: "The dereference operator * accesses the value stored at the memory address held by p."
      },

      {
        q: "Which statement about a union is correct?",
        options: ["Each member has separate memory", "All members share the same memory", "A union can contain only one data type", "Union members cannot be accessed"],
        answer: 1,
        explanation: "All members of a union share the same memory area. The union is large enough to hold its largest member, with alignment requirements."
      },

      {
        q: "What will be the output?\n\nint i;\nfor(i = 0; i < 5; i++) {\n    if(i == 2)\n        continue;\n    printf(\"%d\", i);\n}",
        options: ["01234", "0134", "014", "1234"],
        answer: 1,
        explanation: "continue skips the remaining statements in the current iteration. Therefore, 2 is not printed."
      },

      {
        q: "Which header file is required for malloc()?",
        options: ["stdio.h", "string.h", "stdlib.h", "math.h"],
        answer: 2,
        explanation: "malloc(), calloc(), realloc() and free() are declared in stdlib.h."
      },

      {
        q: "What will be the output?\n\nint a = 10;\nint b = 20;\nint *p = &a;\np = &b;\nprintf(\"%d\", *p);",
        options: ["10", "20", "Address of b", "Compilation error"],
        answer: 1,
        explanation: "The pointer p is reassigned to the address of b, so dereferencing p gives 20."
      },

      {
        q: "Which is the correct declaration of a function pointer that takes two integers and returns an integer?",
        options: ["int *fp(int, int);", "int (*fp)(int, int);", "int fp*(int, int);", "pointer int fp(int, int);"],
        answer: 1,
        explanation: "int (*fp)(int, int) declares fp as a pointer to a function taking two integers and returning an integer."
      },

      {
        q: "What will be the output?\n\nint a[] = {10, 20, 30, 40};\nprintf(\"%d\", *(a + 2));",
        options: ["10", "20", "30", "40"],
        answer: 2,
        explanation: "a + 2 points to the third array element. Dereferencing it gives 30."
      },

      {
        q: "What is recursion in C?",
        options: ["A function calling itself", "A loop inside a function", "A pointer accessing memory", "A function calling another program"],
        answer: 0,
        explanation: "Recursion occurs when a function calls itself directly or indirectly."
      },

      {
        q: "Which declaration correctly defines a constant integer variable?",
        options: ["const int x = 10;", "constant int x = 10;", "int x constant;", "const x int = 10;"],
        answer: 0,
        explanation: "const int x = 10; declares an integer object whose value cannot be modified through that identifier."
      },

      {
        q: "What will be the output?\n\nint x = 5;\nprintf(\"%d\", x << 1);",
        options: ["5", "10", "20", "2"],
        answer: 1,
        explanation: "Left shifting 5 by one bit gives 10, provided the result is representable."
      },

      {
        q: "Which function reads formatted input from a string?",
        options: ["scanf()", "fscanf()", "sscanf()", "gets()"],
        answer: 2,
        explanation: "sscanf() reads formatted data from a character string."
      },

      {
        q: "What will be the output?\n\nint a = 10;\nint b = 5;\nprintf(\"%d\", a > b ? a : b);",
        options: ["5", "10", "1", "0"],
        answer: 1,
        explanation: "The condition a > b is true, so the conditional operator selects a, which is 10."
      },

      {
        q: "Which statement about arrays in C is correct?",
        options: ["Array elements are stored in contiguous memory locations", "Array elements are stored randomly", "An array can store only one element", "Array size changes automatically"],
        answer: 0,
        explanation: "Array elements are stored in contiguous memory locations and accessed using indexes."
      },

      {
        q: "What is a dangling pointer?",
        options: ["A pointer initialized to NULL", "A pointer referring to memory that is no longer valid", "A pointer pointing to an integer", "A pointer to a function"],
        answer: 1,
        explanation: "A dangling pointer refers to memory that has been freed or whose object lifetime has ended."
      }

    ];

    const QUESTIONS_PER_TEST = 25;

    const TOTAL_TIME = 10 * 60;

    const form = document.getElementById("testForm");
    const questionsContainer = document.getElementById("questionsContainer");
    const timerElement = document.getElementById("timer");
    const resultCard = document.getElementById("resultCard");
    const reviewContainer = document.getElementById("reviewContainer");

    let quizQuestions = [];
    let selectedAnswers = [];
    let timeLeft = TOTAL_TIME;
    let timerInterval = null;
    let submitted = false;

    // C Moderate test page check

    const selectedSkill = localStorage.getItem("selectedSkill");
    const selectedLevel = localStorage.getItem("selectedLevel");

    if (
      (selectedSkill && selectedSkill !== "C") ||
      (selectedLevel && selectedLevel !== "Moderate")
    ) {

      document.getElementById("testHeader").style.display = "none";
      form.style.display = "none";
      resultCard.style.display = "block";

      resultCard.innerHTML = `
        <h2>Test Not Available Yet</h2>
        <p>Abhi sirf C Moderate test select karo.</p>
        <p>Dashboard par jaakar C Moderate select karo.</p>
        <br>
        <a href="main.html">Back to Dashboard</a>
      `;

    } else {
      startTest();
    }

    function shuffleArray(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    function startTest() {
      quizQuestions = shuffleArray(allQuestions).slice(0, QUESTIONS_PER_TEST);

      selectedAnswers = Array(quizQuestions.length).fill(null);

      renderQuestions();
      updateTimer();

      timerInterval = setInterval(tickTimer, 1000);
    }

    function renderQuestions() {
      questionsContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {

        const card = document.createElement("section");
        card.className = "question-card";

        const title = document.createElement("h3");
        title.className = "question-title";

        const number = document.createElement("span");
        number.className = "question-number";
        number.textContent = `Q${questionIndex + 1}.`;

        const questionText = document.createElement("span");
        questionText.className = "question-text";
        questionText.textContent = question.q;

        title.append(number, questionText);
        card.appendChild(title);

        // Shuffle options while preserving the correct answer

        const options = shuffleArray(
          question.options.map((text, originalIndex) => ({
            text,
            isCorrect: originalIndex === question.answer
          }))
        );

        question.displayOptions = options;

        options.forEach((option, optionIndex) => {

          const button = document.createElement("button");
          button.type = "button";
          button.className = "option";

          const letter = document.createElement("span");
          letter.className = "option-letter";
          letter.textContent = String.fromCharCode(65 + optionIndex);

          const text = document.createElement("span");
          text.textContent = option.text;

          button.append(letter, text);

          button.addEventListener("click", () => {

            if (submitted) return;

            selectedAnswers[questionIndex] = optionIndex;

            card.querySelectorAll(".option").forEach(item => {
              item.classList.remove("selected");
            });

            button.classList.add("selected");
          });

          card.appendChild(button);

        });

        questionsContainer.appendChild(card);

      });
    }

    function tickTimer() {
      if (submitted) return;

      timeLeft--;
      updateTimer();

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        finishTest(true);
      }
    }

    function updateTimer() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;

      timerElement.textContent =
        `Time Left: ${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;
    }

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      if (submitted) return;

      const attempted = selectedAnswers.filter(
        answer => answer !== null
      ).length;

      if (!confirm(
        `You answered ${attempted} out of ${QUESTIONS_PER_TEST} questions. Submit test?`
      )) {
        return;
      }

      finishTest(false);

    });

    function finishTest(autoSubmitted) {
      if (submitted) return;

      submitted = true;
      clearInterval(timerInterval);

      let score = 0;
      let attempted = 0;

      quizQuestions.forEach((question, questionIndex) => {

        const selected = selectedAnswers[questionIndex];

        if (selected !== null) attempted++;

        const correctDisplayIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        if (selected === correctDisplayIndex) score++;

        const card = questionsContainer.children[questionIndex];
        const optionButtons = card.querySelectorAll(".option");

        optionButtons.forEach((button, optionIndex) => {

          button.disabled = true;

          if (question.displayOptions[optionIndex].isCorrect) {
            button.classList.add("correct");
          }

          if (
            selected === optionIndex &&
            !question.displayOptions[optionIndex].isCorrect
          ) {
            button.classList.add("wrong");
          }

        });

      });

      form.style.display = "none";
      document.getElementById("testHeader").style.display = "none";
      resultCard.style.display = "block";

      const percentage = Math.round(
        (score / QUESTIONS_PER_TEST) * 100
      );

      document.getElementById("scoreText").textContent =
        `Your Score: ${score}/${QUESTIONS_PER_TEST} (${percentage}%)`;

      document.getElementById("resultMessage").textContent =
        `${attempted} attempted • ${QUESTIONS_PER_TEST - attempted} unanswered` +
        (autoSubmitted ? " • Time is over; test submitted automatically." : "");

      renderReview();
      saveTestHistory(score);

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview() {
      reviewContainer.innerHTML = "";

      quizQuestions.forEach((question, questionIndex) => {

        const selected = selectedAnswers[questionIndex];

        const correctIndex = question.displayOptions.findIndex(
          option => option.isCorrect
        );

        const review = document.createElement("div");
        review.className = "review-item";

        const title = document.createElement("strong");
        title.textContent = `Q${questionIndex + 1}. ${question.q}`;

        review.appendChild(title);

        const yourAnswer = document.createElement("p");

        yourAnswer.textContent = selected === null
          ? "Your answer: Not attempted"
          : `Your answer: ${question.displayOptions[selected].text}`;

        yourAnswer.className =
          selected === correctIndex ? "correct-text" : "wrong-text";

        review.appendChild(yourAnswer);

        const correctAnswer = document.createElement("p");
        correctAnswer.className = "correct-text";

        correctAnswer.textContent =
          `Correct answer: ${question.displayOptions[correctIndex].text}`;

        review.appendChild(correctAnswer);

        const explanation = document.createElement("p");
        explanation.textContent = `Explanation: ${question.explanation}`;

        review.appendChild(explanation);
        reviewContainer.appendChild(review);

      });
    }

    function saveTestHistory(score) {

      const currentUser = JSON.parse(
        localStorage.getItem("skillCheckCurrentUser") || "null"
      );

      if (!currentUser || !currentUser.username) return;

      let history = [];

      try {

        const storedHistory = JSON.parse(
          localStorage.getItem("skillCheckTestHistory") || "[]"
        );

        if (Array.isArray(storedHistory)) {
          history = storedHistory;
        }

      } catch (error) {
        history = [];
      }

      history.push({
        username: currentUser.username,
        skill: "C",
        level: "Moderate",
        score: score,
        date: new Date().toLocaleString()
      });

      localStorage.setItem(
        "skillCheckTestHistory",
        JSON.stringify(history)
      );

    }

  </script>

</body>
</html>
