<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillCheck - Login</title>

  <style>
    /* Overall Page Styling */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    /* Login Box */
    .container {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
      width: 320px;
      max-width: calc(100% - 70px);
      text-align: center;
      animation: fadeIn 0.7s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      color: #2575fc;
      margin-bottom: 8px;
      font-size: 32px;
    }

    h2 {
      color: #555;
      margin-bottom: 25px;
      font-size: 18px;
    }

    /* Input Fields */
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #2575fc;
      box-shadow: 0 0 8px rgba(37, 117, 252, 0.3);
    }

    /* Login Button */
    button {
      background: #2575fc;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      width: 100%;
      transition: 0.3s;
    }

    button:hover {
      background: #6a11cb;
      transform: scale(1.02);
    }

    /* Footer Text */
    p {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }

    a {
      color: #2575fc;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>SkillCheck</h1>
    <h2>Welcome Back!</h2>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>

      <p>
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>
    </form>
  </div>

  <script>
    // Login Form Logic
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      // Get registered users
      const users = JSON.parse(localStorage.getItem("skillCheckUsers")) || [];

      // Verify username and password
      const matchedUser = users.find(function(user) {
        return user.username.toLowerCase() === username.toLowerCase()
          && user.password === password;
      });

      if (matchedUser) {
        // Save current user's details
        localStorage.setItem("skillCheckCurrentUser", JSON.stringify({
          name: matchedUser.name,
          username: matchedUser.username
        }));

        alert("Login successful! Welcome, " + matchedUser.name + ".");

        // Open the main page
        window.location.href = "main.html";
      } else {
        alert("Invalid username or password. Please try again.");
      }
    });
  </script>

</body>
</html>
